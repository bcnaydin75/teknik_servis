<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Çevrimdışı — Teknik Servis</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, #0c0c0e 55%);
        color: #e2e8f0;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #94a3b8;
      }
      button {
        margin-top: 1.5rem;
        border: 0;
        border-radius: 12px;
        padding: 0.75rem 1.25rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #0f172a;
        background: #e2e8f0;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Çevrimdışısınız</h1>
      <p>İnternet bağlantısı yok. Bağlantı gelince tekrar deneyin.</p>
      <button type="button" onclick="location.reload()">Yeniden dene</button>
    </main>
  </body>
</html>
